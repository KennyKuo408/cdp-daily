name: Daily CDP Download

on:
  schedule:
    - cron: "12 9 * * *"    # 每天台北 15:12（GitHub 用 UTC，台北時間減 8 小時）
  workflow_dispatch:         # 允許在 Actions 頁面手動按按鈕執行（測試用）

permissions:
  contents: write            # 允許 workflow 把報表 commit 回 repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      OUTPUT_DIR: ${{ github.workspace }}/output

    steps:
      - name: 取得 repo 裡的程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行下載與分析
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          python download_cdp.py
          echo "產出的檔案："
          ls -l "$OUTPUT_DIR"

      - name: 整理報表到 reports/日期/，並把彙總表另存成 CSV（方便 Claude 讀取）
        run: |
          shopt -s nullglob
          summary=("$OUTPUT_DIR"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].xlsx)
          if [ ${#summary[@]} -eq 0 ]; then
            echo "::error::找不到彙總表（YYYYMMDD.xlsx）"
            exit 1
          fi
          tag=$(basename "${summary[0]}" .xlsx)
          dest="reports/$tag"
          mkdir -p "$dest"
          cp "$OUTPUT_DIR"/*.xlsx "$dest"/
          echo "REPORT_TAG=$tag" >> "$GITHUB_ENV"

          python - "$dest/$tag.xlsx" "$dest/summary.csv" << 'PY'
          import sys
          import pandas as pd
          src, dst = sys.argv[1], sys.argv[2]
          df = pd.read_excel(src, sheet_name="彙總")
          for col in ["FPY (%)", "VPY (%)", "NDF"]:
              if col in df.columns:
                  df[col] = df[col].map(lambda v: "" if pd.isna(v) else f"{v * 100:.2f}%")
          for col in ["P10 (sec)", "P50 (sec)", "P90 (sec)", "Std (sec)"]:
              if col in df.columns:
                  df[col] = df[col].round(2)
          df.to_csv(dst, index=False, encoding="utf-8-sig")
          print(f"已產生 {dst}，共 {len(df)} 列")
          PY

          echo "本次存進 repo 的檔案："
          ls -l "$dest"

      - name: Commit 回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f reports/                 # -f：.gitignore 有擋 xlsx/csv，這裡強制加入 reports 資料夾
          if git diff --cached --quiet; then
            echo "報表內容跟上次一樣，不需要 commit"
            exit 0
          fi
          git commit -m "Daily report $REPORT_TAG"
          git push
