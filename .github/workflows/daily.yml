name: Daily CDP Download

on:
  schedule:
    - cron: "0 23 * * *"    # 每天台北 15:12（GitHub 用 UTC，台北時間減 8 小時）
  workflow_dispatch:         # 允許在 Actions 頁面手動按按鈕執行（測試用）
  
permissions:
  contents: write            # 允許 workflow 把報表 commit 回 repo
 
concurrency:
  group: daily-cdp           # 同一時間只跑一個，避免兩次執行互相搶著 push
  cancel-in-progress: false


 
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      OUTPUT_DIR: ${{ github.workspace }}/output
 
    steps:
    
      # 更新這些版本 ↓
      - uses: actions/checkout@v4    # 改成 v4（或最新）
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: actions/setup-python@v5  # 改成 v5（或最新）
        with:
          python-version: '3.x'

    
      - name: 取得 repo 裡的程式碼
        uses: actions/checkout@v4
 
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
 
      - name: 安裝套件
        run: pip install -r requirements.txt
 
      - name: 執行下載與分析
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          python download_cdp.py
          echo "產出的檔案："
          ls -l "$OUTPUT_DIR"
 
      - name: 整理報表到 reports/日期/，並把彙總表另存成 CSV（方便 Claude 讀取）
        run: |
          shopt -s nullglob
          summary=("$OUTPUT_DIR"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].xlsx)
          if [ ${#summary[@]} -eq 0 ]; then
            echo "::error::找不到彙總表（YYYYMMDD.xlsx）"
            exit 1
          fi
          tag=$(basename "${summary[0]}" .xlsx)
          dest="reports/$tag"
          mkdir -p "$dest"
          cp "$OUTPUT_DIR"/*.xlsx "$dest"/
          echo "REPORT_TAG=$tag" >> "$GITHUB_ENV"
 
          python - "$dest/$tag.xlsx" "$dest/summary.csv" << 'PY'
          import sys
          import pandas as pd
          src, dst = sys.argv[1], sys.argv[2]
          df = pd.read_excel(src, sheet_name="彙總")
          for col in ["FPY (%)", "VPY (%)", "NDF"]:
              if col in df.columns:
                  df[col] = df[col].map(lambda v: "" if pd.isna(v) else f"{v * 100:.2f}%")
          for col in ["P10 (sec)", "P50 (sec)", "P90 (sec)", "Std (sec)"]:
              if col in df.columns:
                  df[col] = df[col].round(2)
          df.to_csv(dst, index=False, encoding="utf-8-sig")
          print(f"已產生 {dst}，共 {len(df)} 列")
          PY
 
          echo "本次存進 repo 的檔案："
          ls -l "$dest"
 
      - name: Commit 回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
 
          # 先把這次的報表另外備份，不在 git 裡做合併，避免 xlsx 這種二進位檔產生衝突
          backup="$RUNNER_TEMP/report_$REPORT_TAG"
          rm -rf "$backup"
          cp -r "reports/$REPORT_TAG" "$backup"
 
          for i in 1 2 3; do
            # 每次都對齊 GitHub 上最新的 main，再把這次的報表蓋上去 → 同一天的報表一律以最新這次為準
            git fetch origin main
            git reset --hard origin/main
            rm -rf "reports/$REPORT_TAG"
            mkdir -p reports
            cp -r "$backup" "reports/$REPORT_TAG"
 
            git add -f "reports/$REPORT_TAG"   # -f：.gitignore 有擋 xlsx/csv，這裡強制加入
            if git diff --cached --quiet; then
              echo "報表內容跟 GitHub 上的一樣，不需要 commit"
              exit 0
            fi
            git commit -m "Daily report $REPORT_TAG"
            if git push origin HEAD:main; then
              echo "push 成功"
              exit 0
            fi
            echo "push 失敗，第 $i 次重試..."
            sleep 5
          done
          echo "::error::重試 3 次仍無法 push"
          exit 1
 
