name: Daily CDP Download

on:
  schedule:
    - cron: "07 23 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "起始日 YYYY-MM-DD(留空 = 用程式預設)"
        required: false
        default: ""
        type: string
      end_date:
        description: "結束日 YYYY-MM-DD(留空 = 用程式預設)"
        required: false
        default: ""
        type: string

permissions:
  contents: write            # 允許 workflow 把報表 commit 回 repo

concurrency:
  group: daily-cdp           # 同一時間只跑一個，避免兩次執行互相搶著 push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      OUTPUT_DIR: ${{ github.workspace }}/output

    steps:
      - name: 取得 repo 裡的程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行下載與分析
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          ARGS=()
          if [ -n "$START_DATE" ]; then ARGS+=(--start "$START_DATE"); fi
          if [ -n "$END_DATE" ];   then ARGS+=(--end "$END_DATE");   fi
          echo "執行參數：${ARGS[*]:-（無，使用預設日期）}"
          python download_cdp.py "${ARGS[@]}"
          echo "產出的檔案："
          ls -l "$OUTPUT_DIR"

      - name: 整理報表到 reports/日期/，並拆成 summary.csv 與 LoB.xlsx
        run: |
          shopt -s nullglob
          summary=("$OUTPUT_DIR"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].xlsx)
          if [ ${#summary[@]} -eq 0 ]; then
            echo "::error::找不到彙總表（YYYYMMDD.xlsx）"
            exit 1
          fi
          tag=$(basename "${summary[0]}" .xlsx)
          dest="reports/$tag"
          mkdir -p "$dest"
          cp "$OUTPUT_DIR"/*.xlsx "$dest"/
          echo "REPORT_TAG=$tag" >> "$GITHUB_ENV"

          python - "$dest/$tag.xlsx" "$dest" << 'PY'
          import sys
          import pandas as pd

          src, dest = sys.argv[1], sys.argv[2]

          KEEP = ["Site", "Project", "Board", "Input Qty", "Output Qty",
                  "Failure Qty", "FPY (%)", "VPY (%)", "NDF"]
          PCT = ["FPY (%)", "VPY (%)", "NDF"]

          def fmt(v):
              # 沒資料的列是 "-"，不能拿去乘 100；只有真正的數字才轉成百分比
              if isinstance(v, (int, float)) and not pd.isna(v):
                  return f"{v * 100:.2f}%"
              return "" if pd.isna(v) else v

          def to_pct(df):
              for col in PCT:
                  if col in df.columns:
                      df[col] = df[col].map(fmt)
              return df

          xls = pd.ExcelFile(src)
          names = xls.sheet_names
          print("工作表：", names)

          # 依名稱找：彙總 = 「彙總」；LoB = 名稱以 LoB 開頭（LoB 1 / LoB 2 / LoB 3）
          if "彙總" not in names:
              raise SystemExit(f"找不到「彙總」分頁，實際只有：{names}")
          lob_names = [n for n in names if n.replace(" ", "").lower().startswith("lob")]
          if not lob_names:
              raise SystemExit(f"找不到 LoB 分頁，實際只有：{names}")

          # summary.csv：保留「彙總」分頁全部欄位（含 NDF 後面的 P10/P50/P90/Std）
          summary = xls.parse("彙總").copy()
          missing = [c for c in KEEP if c not in summary.columns]
          if missing:
              raise SystemExit(f"「彙總」缺少欄位：{missing}；實際欄位：{list(summary.columns)}")
          summary = to_pct(summary)
          for col in ["P10 (sec)", "P50 (sec)", "P90 (sec)", "Std (sec)"]:
              if col in summary.columns:
                  summary[col] = summary[col].map(
                      lambda v: round(v, 2) if isinstance(v, (int, float)) and not pd.isna(v) else v)
          summary.to_csv(f"{dest}/summary.csv", index=False, encoding="utf-8-sig")
          print(f"已產生 summary.csv，共 {len(summary)} 列")

          with pd.ExcelWriter(f"{dest}/LoB.xlsx", engine="openpyxl") as writer:
              for name in lob_names:
                  raw = xls.parse(name)
                  top_cols = [c for c in raw.columns if str(c).startswith("Top Issue")]
                  df = to_pct(raw[KEEP + top_cols].copy())
                  df.to_excel(writer, sheet_name=name, index=False)
                  ws = writer.sheets[name]
                  for i, col in enumerate(df.columns, start=1):
                      if col in top_cols:
                          ws.column_dimensions[ws.cell(row=1, column=i).column_letter].width = 40
                  print(f"LoB.xlsx 寫入 sheet「{name}」，共 {len(df)} 列，Top Issue 欄位：{top_cols}")
          
          PY

          echo "本次存進 repo 的檔案："
          ls -l "$dest"

      - name: Commit 回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          # 先把這次的報表另外備份，不在 git 裡做合併，避免 xlsx 這種二進位檔產生衝突
          backup="$RUNNER_TEMP/report_$REPORT_TAG"
          rm -rf "$backup"
          cp -r "reports/$REPORT_TAG" "$backup"

          for i in 1 2 3; do
            # 每次都對齊 GitHub 上最新的 main，再把這次的報表蓋上去 → 同一天的報表一律以最新這次為準
            git fetch origin main
            git reset --hard origin/main
            rm -rf "reports/$REPORT_TAG"
            mkdir -p reports
            cp -r "$backup" "reports/$REPORT_TAG"

            git add -f "reports/$REPORT_TAG"   # -f：.gitignore 有擋 xlsx/csv，這裡強制加入
            if git diff --cached --quiet; then
              echo "報表內容跟 GitHub 上的一樣，不需要 commit"
              exit 0
            fi
            git commit -m "Daily report $REPORT_TAG"
            if git push origin HEAD:main; then
              echo "push 成功"
              exit 0
            fi
            echo "push 失敗，第 $i 次重試..."
            sleep 5
          done
          echo "::error::重試 3 次仍無法 push"
          exit 1
